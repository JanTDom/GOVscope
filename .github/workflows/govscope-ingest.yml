name: GOVscope live ingestion

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ingestion dependencies
        run: python -m pip install --disable-pip-version-check asyncpg httpx tenacity pydantic pydantic-settings
      - name: Fetch verified public sources
        env:
          DATABASE_URL: ${{ secrets.GOVSCOPE_DATABASE_URL }}
        run: python -m ingest.live
      - name: Refresh active government roster
        env:
          DATABASE_URL: ${{ secrets.GOVSCOPE_DATABASE_URL }}
        run: python -m ingest.administration
