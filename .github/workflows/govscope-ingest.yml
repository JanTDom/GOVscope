name: GOVscope live ingestion

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: govscope-live-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and persist verified public sources
        run: >-
          curl --fail-with-body --retry 3 --retry-delay 5 --max-time 180
